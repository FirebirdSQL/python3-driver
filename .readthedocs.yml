version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    install:
      - pip install . zensical mkdocstrings-python
    build:
      html:
        - cd docs && zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive docs/site/. $READTHEDOCS_OUTPUT/html/
